<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body {
            background-color: rgb(210, 218, 225);
            display: flex;
            justify-content: center;
            font-family: Helvetica, sans-serif;
        }

        .card {
            width: 350px;
            height: auto;
            background-color: white;
            border-radius: 20px;
            padding: 10px;
            box-shadow: 0px 0px 20px rgb(210, 218, 225);
        }

        .header {
            background-color: rgb(209, 233, 242);
            padding: 20px;
            border-radius: 15px;
        }

        .bubbles {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 10px;
            padding-bottom: 10px;
            padding-top: 10px;
        }

        .bubbles span{
            padding: 6px 12px;
            background-color: rgb(149, 216, 241);
            border-radius: 999px;
        }

        .explore {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            padding: 10px;
            padding-left: 15px;
            align-items: center;
        }

        .arrow  {
            background-color: rgb(239, 239, 239);
            width: 30px;
            height: 30px;
            padding: 10px;
            border-radius: 10px;
        }

        .arrow:hover{
            cursor: pointer;
        }


    </style>
</head>

<body>
    <div class="card">
        <div class="header">
            <h1>Web Design</h1>
            <p> Crafts engaging, user-friendly websites.</p>
            <div class="bubbles">
                <span>Landing Pages</span>
                <span>Website</span>
                <span>One Page</span>
            </div>
        </div>
        <div class = "explore">
            <h2>Explore</h2>
            <div class = "arrow"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M566.6 342.6C579.1 330.1 579.1 309.8 566.6 297.3L406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3C348.8 149.8 348.8 170.1 361.3 182.6L466.7 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L466.7 352L361.3 457.4C348.8 469.9 348.8 490.2 361.3 502.7C373.8 515.2 394.1 515.2 406.6 502.7L566.6 342.7z"/></svg></div>
        </div>
    </div>
</body>

</html>
